<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="t2.css" />
    <script src="t2.js" defer></script>
  </head>

  <body>
    <h1>Restaurants</h1>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <dialog>
      <h2 id="restaurant-dialog-name"></h2>
      <dl>
        <dt>Address</dt>
        <dd id="restaurant-address"></dd>
        <dt>Postal code</dt>
        <dd id="restaurant-postal-code"></dd>
        <dt>City</dt>
        <dd id="restaurant-city"></dd>
        <dt>Phone number</dt>
        <dd id="restaurant-phone"></dd>
        <dt>Company</dt>
        <dd id="restaurant-company"></dd>
      </dl>
      <form method="dialog">
        <button type="submit">Close</button>
      </form>
    </dialog>
  </body>
</html>
